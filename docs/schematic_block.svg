<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#f8f9fa"/>
<text x="600" y="30" text-anchor="middle" font-size="22" font-family="monospace" font-weight="bold">Icarus-GPU v0.3 — Top Schematics (derived from tiny-gpu reference)</text>
<text x="600" y="50" text-anchor="middle" font-size="12" font-family="monospace" fill="#666">Reference: reference/tiny-gpu/src (8 cores → scaled to 4 cores ×4 lanes) + Pathfinder prefetcher</text>
<!-- GPU Top -->
<rect x="150" y="80" rx="12" width="900" height="680" fill="none" stroke="#333" stroke-width="2"/>
<text x="600" y="100" text-anchor="middle" font-size="14" font-family="monospace">icarus_gpu_top (clk_sys, rst_n, AXI4, AXI-Stream)</text>
<!-- Command Processor -->
<rect x="180" y="120" width="220" height="80" fill="#d0ebff" stroke="#333" rx="6"/>
<text x="290" y="145" text-anchor="middle" font-size="12" font-family="monospace">Command Processor</text>
<text x="290" y="160" text-anchor="middle" font-size="10" font-family="monospace">AXI-Stream 64b → cmd_packet_t</text>
<text x="290" y="175" text-anchor="middle" font-size="9" font-family="monospace">s_axis_tvalid/ready</text>
<!-- Scheduler -->
<rect x="480" y="120" width="220" height="80" fill="#d3f9d8" stroke="#333" rx="6"/>
<text x="590" y="145" text-anchor="middle" font-size="12" font-family="monospace">Scheduler (Conductor)</text>
<text x="590" y="160" text-anchor="middle" font-size="10" font-family="monospace">wave → 4× core_ce</text>
<text x="590" y="175" text-anchor="middle" font-size="9" font-family="monospace">power-gate idle</text>
<!-- L2 + Prefetcher -->
<rect x="770" y="120" width="220" height="80" fill="#fff3bf" stroke="#333" rx="6"/>
<text x="880" y="145" text-anchor="middle" font-size="12" font-family="monospace">L2 Cache 256KB</text>
<text x="880" y="160" text-anchor="middle" font-size="10" font-family="monospace">+ Pathfinder 4-entry</text>
<text x="880" y="175" text-anchor="middle" font-size="9" font-family="monospace">bypass_en, 85% hit</text>
<!-- 4 shader cores -->
<g id="cores">
<rect x="180" y="240" width="210" height="140" fill="#e5dbff" stroke="#333" rx="6"/>
<text x="285" y="265" text-anchor="middle" font-size="12" font-family="monospace">Shader Core 0</text>
<text x="285" y="280" text-anchor="middle" font-size="10" font-family="monospace">4 lanes SIMT</text>
<text x="285" y="295" text-anchor="middle" font-size="9" font-family="monospace">RV32IM + FP16/INT8</text>
<text x="285" y="310" text-anchor="middle" font-size="9" font-family="monospace">auto-precision</text>
<text x="285" y="325" text-anchor="middle" font-size="9" font-family="monospace">sparsity skip</text>
<text x="285" y="345" text-anchor="middle" font-size="9" font-family="monospace" fill="#555">shader_core.sv:15</text>
<rect x="420" y="240" width="210" height="140" fill="#e5dbff" stroke="#333" rx="6"/>
<text x="525" y="265" text-anchor="middle" font-size="12" font-family="monospace">Shader Core 1</text>
<text x="525" y="280" text-anchor="middle" font-size="10" font-family="monospace">4 lanes SIMT</text>
<rect x="660" y="240" width="210" height="140" fill="#e5dbff" stroke="#333" rx="6"/>
<text x="765" y="265" text-anchor="middle" font-size="12" font-family="monospace">Shader Core 2</text>
<rect x="880" y="240" width="130" height="140" fill="#e5dbff" stroke="#333" rx="6"/>
<text x="945" y="265" text-anchor="middle" font-size="12" font-family="monospace">Core 3</text>
</g>
<!-- Rasterizer -->
<rect x="180" y="420" width="300" height="80" fill="#ffec99" stroke="#333" rx="6"/>
<text x="330" y="445" text-anchor="middle" font-size="12" font-family="monospace">Rasterizer (fixed)</text>
<text x="330" y="460" text-anchor="middle" font-size="10" font-family="monospace">edge-function 640×480</text>
<text x="330" y="475" text-anchor="middle" font-size="9" font-family="monospace">fb_x/y/color</text>
<!-- DDR -->
<rect x="550" y="420" width="280" height="80" fill="#ffd8a8" stroke="#333" rx="6"/>
<text x="690" y="445" text-anchor="middle" font-size="12" font-family="monospace">DDR Controller (AXI4 64b)</text>
<text x="690" y="460" text-anchor="middle" font-size="10" font-family="monospace">m_axi_ar/aw/r/w/b</text>
<!-- Thermal -->
<rect x="880" y="420" width="130" height="80" fill="#ffc9c9" stroke="#333" rx="6"/>
<text x="945" y="445" text-anchor="middle" font-size="11" font-family="monospace">Thermal</text>
<text x="945" y="460" text-anchor="middle" font-size="10" font-family="monospace">45°C 1.2W</text>
<!-- Arrows -->
<line x1="400" y1="160" x2="480" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="700" y1="160" x2="770" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590" y1="200" x2="590" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="880" y1="200" x2="880" y2="240" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="905" y="225" font-size="8" font-family="monospace" fill="#666">prefetch 85%</text>
<line x1="880" y1="500" x2="830" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="500" x2="550" y2="500" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
<text x="440" y="495" font-size="8" font-family="monospace" fill="#666">L2 → DDR</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs>
<text x="600" y="560" text-anchor="middle" font-size="10" font-family="monospace" fill="#333">Reference tiny-gpu: src/gpu.sv:9679 + src/core.sv:8178 + src/scheduler.sv:4956 merged with Pathfinder (Perpetual energy.txt:433)</text>
<text x="600" y="580" text-anchor="middle" font-size="10" font-family="monospace" fill="#666">All busses AXI4/AXI-Stream (APB for config), clk_sys + per-core clk_en gating — synthesizable for Artix-7</text>
<text x="600" y="740" text-anchor="middle" font-size="9" font-family="monospace" fill="#888">File: rtl/top/icarus_gpu_top.sv:1 | rtl/core/shader_core.sv:15 | rtl/memory/prefetcher.sv:1 | docs/schematic_block.svg</text>
</svg>